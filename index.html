<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MealMuse Recipe Finder</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header><div><p class="eyebrow">FIND YOUR NEXT FAVOURITE</p><h1>MealMuse ✳</h1><p class="muted">Good food starts with an idea.</p></div><button id="themeBtn">◐</button></header>
<section class="hero"><p class="eyebrow">WHAT ARE YOU CRAVING?</p><h2>Discover something delicious.</h2><form id="searchForm"><input id="searchInput" placeholder="Try pasta, paneer, salad..." required><button id="searchBtn">Find recipes</button></form><div class="chips"><button data-query="pasta">Pasta</button><button data-query="salad">Salad</button><button data-query="chicken">Chicken</button><button data-query="cake">Cake</button></div></section>
<section><div class="section-head"><h2 id="resultsHeading">Recipe ideas</h2><span id="resultCount"></span></div><p id="statusMessage">Search for a dish or ingredient to begin.</p><div id="recipeGrid" class="grid"></div></section>
<section class="saved"><div class="section-head"><h2>Saved recipes</h2><span id="savedCount">0 saved</span></div><div id="savedGrid" class="grid"><p class="muted">Your saved recipes will appear here.</p></div></section><footer>Cook something lovely ✦</footer></main>
<div id="recipeModal" class="modal hidden"><div id="modalBackdrop" class="backdrop"></div><article class="modal-card"><button id="closeModalBtn" class="close">×</button><div id="modalContent"></div></article></div><script src="script.js"></script></body></html>
